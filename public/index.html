<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Radar</title>
<meta name="description" content="What software developers are talking about, collected from Hacker News, GitHub, Lobsters and tech feeds every 2 hours.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fe4'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='2' opacity='.5'/%3E%3Ccircle cx='16' cy='16' r='4' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M16 16 L24 9' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --panel-2: #fafbfc; --ink: #12151a; --ink-2: #3d4450; --muted: #6b7380;
    --line: #e4e7ec; --line-2: #eef0f3; --accent: #2f6fe4; --accent-soft: #e8f0fe; --accent-ink: #ffffff;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    --shadow-lg: 0 12px 32px rgba(16,24,40,.14);
    --new: #12a150;
    --c-ai-coding: #7c3aed; --c-ai-models: #4f46e5; --c-cloud: #0284c7; --c-web: #d97706; --c-backend: #059669;
    --c-security: #dc2626; --c-career: #db2777; --c-languages: #0d9488; --c-other: #8a94a3;
    --s-hackernews: #ff6600; --s-github: #24292f; --s-lobsters: #ac130d; --s-rss: #2f6fe4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1014; --panel: #151a20; --panel-2: #12161b; --ink: #e8ebef; --ink-2: #c3c9d2; --muted: #8b94a1;
      --line: #252c35; --line-2: #1d232b; --accent: #6b9dff; --accent-soft: #1b2638; --accent-ink: #0d1014;
      --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
      --new: #34d17a;
      --c-ai-coding: #a78bfa; --c-ai-models: #818cf8; --c-cloud: #38bdf8; --c-web: #fbbf24; --c-backend: #34d399;
      --c-security: #f87171; --c-career: #f472b6; --c-languages: #2dd4bf; --c-other: #8b94a1;
      --s-github: #c9d1d9; --s-lobsters: #e5534b; --s-rss: #6b9dff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1014; --panel: #151a20; --panel-2: #12161b; --ink: #e8ebef; --ink-2: #c3c9d2; --muted: #8b94a1;
    --line: #252c35; --line-2: #1d232b; --accent: #6b9dff; --accent-soft: #1b2638; --accent-ink: #0d1014;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
    --new: #34d17a;
    --c-ai-coding: #a78bfa; --c-ai-models: #818cf8; --c-cloud: #38bdf8; --c-web: #fbbf24; --c-backend: #34d399;
    --c-security: #f87171; --c-career: #f472b6; --c-languages: #2dd4bf; --c-other: #8b94a1;
    --s-github: #c9d1d9; --s-lobsters: #e5534b; --s-rss: #6b9dff;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  .s { display: none; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-feature-settings: "cv11", "ss01"; }
  a { color: inherit; }
  button, select, input { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  /* ---------- header ---------- */
  .top { display: flex; align-items: center; gap: 14px; padding: 22px 0 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  .logo { width: 40px; height: 40px; flex: none; border-radius: 11px; background: var(--accent); display: grid; place-items: center; box-shadow: var(--shadow); }
  .logo .sweep { transform-origin: 20px 20px; animation: sweep 6s linear infinite; }
  @keyframes sweep { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .logo .sweep { animation: none; } }
  h1 { font-size: 20px; line-height: 1.2; margin: 0; letter-spacing: -0.02em; font-weight: 700; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .actions { display: flex; align-items: center; gap: 8px; }
  .updated { color: var(--muted); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--new); box-shadow: 0 0 0 3px color-mix(in srgb, var(--new) 22%, transparent); }
  .icon-btn { height: 34px; min-width: 34px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px; cursor: pointer; color: var(--ink-2); box-shadow: var(--shadow); }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn[disabled] { opacity: .6; cursor: progress; }
  .icon-btn svg { width: 16px; height: 16px; }

  /* ---------- sticky toolbar ---------- */
  .toolbar { position: sticky; top: 0; z-index: 5; padding: 10px 0 10px; margin-bottom: 6px;
    background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: saturate(160%) blur(10px); -webkit-backdrop-filter: saturate(160%) blur(10px); }
  .toolbar.stuck { border-bottom: 1px solid var(--line); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .search { position: relative; flex: 1 1 260px; min-width: 0; }
  .search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .search input { width: 100%; height: 38px; padding: 0 40px 0 34px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); box-shadow: var(--shadow); outline: none; }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search kbd { position: absolute; right: 9px; top: 50%; translate: 0 -50%; font: 11px/1 Inter, system-ui, sans-serif; color: var(--muted);
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 3px 6px; background: var(--panel-2); }
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--line-2); border: 1px solid var(--line); border-radius: 10px; }
  .seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; font-size: 13px; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  .select { height: 38px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 0 10px; box-shadow: var(--shadow); cursor: pointer; max-width: 100%; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink-2); font-size: 13px; font-weight: 500; }
  .chip:hover { border-color: var(--tc, var(--accent)); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tc, var(--accent)); }
  .chip .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .chip.on { background: color-mix(in srgb, var(--tc, var(--accent)) 14%, var(--panel)); border-color: var(--tc, var(--accent)); color: var(--ink); }
  .chip.on .n { color: var(--ink-2); }

  /* ---------- featured ---------- */
  .section-label { display: flex; align-items: baseline; justify-content: space-between; margin: 14px 2px 8px; }
  .section-label h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .section-label span { font-size: 12px; color: var(--muted); }
  .featured { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .feat { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow); transition: border-color .15s, transform .15s, box-shadow .15s; min-width: 0; }
  .feat:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .feat .rankno { position: absolute; top: 12px; right: 14px; font-size: 28px; font-weight: 700; color: var(--line); line-height: 1; }
  .feat-title { font-size: 15.5px; font-weight: 650; line-height: 1.35; text-decoration: none; letter-spacing: -0.01em; overflow-wrap: anywhere; padding-right: 26px; }
  .feat-title::after { content: ""; position: absolute; inset: 0; border-radius: 14px; }
  .feat p { margin: 0; color: var(--ink-2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .feat .meta { margin-top: auto; position: relative; z-index: 1; }

  /* ---------- list ---------- */
  .list { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .item { display: grid; grid-template-columns: 64px 1fr; gap: 14px; padding: 13px 16px 13px 12px; border-top: 1px solid var(--line-2); transition: background .12s; }
  .item:first-child { border-top: 0; }
  .item:hover { background: var(--panel-2); }
  .score { display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; padding: 6px 0; height: fit-content;
    background: color-mix(in srgb, var(--sc) 9%, transparent); color: var(--sc); }
  .score b { font-size: 15px; line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; opacity: .85; }
  .line1 { display: flex; align-items: flex-start; gap: 8px; }
  .fav { width: 16px; height: 16px; border-radius: 4px; margin-top: 2px; flex: none; background: var(--line-2); }
  .title { font-weight: 600; font-size: 14.5px; text-decoration: none; overflow-wrap: anywhere; line-height: 1.4; }
  .title:hover { color: var(--accent); }
  .title:visited { color: var(--muted); }
  .new { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; vertical-align: 2px;
    color: var(--new); background: color-mix(in srgb, var(--new) 13%, transparent); }
  .summary { color: var(--muted); font-size: 13px; margin: 3px 0 0 24px; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 12.5px; margin: 5px 0 0 24px; }
  .feat .meta { margin-left: 0; }
  .meta a { color: var(--muted); text-decoration: none; }
  .meta a:hover { color: var(--accent); text-decoration: underline; }
  .src { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--ink-2); }
  .src::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--sc); }
  .sep { color: var(--line); }
  .tags { display: inline-flex; gap: 5px; flex-wrap: wrap; }
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500;
    color: var(--tc); background: color-mix(in srgb, var(--tc) 11%, transparent); cursor: pointer; border: 0; }
  .tag:hover { background: color-mix(in srgb, var(--tc) 20%, transparent); }
  .more { display: flex; margin: 16px auto 0; height: 38px; padding: 0 18px; }
  .empty { padding: 56px 20px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
  .empty button { margin-top: 12px; }

  /* skeleton */
  .sk { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--line-2), var(--line), var(--line-2)); background-size: 200% 100%; animation: sk 1.2s infinite; }
  @keyframes sk { to { background-position: -200% 0; } }

  /* hover card */
  .pop { position: fixed; z-index: 20; width: min(440px, calc(100vw - 32px)); background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow-lg);
    pointer-events: none; opacity: 0; translate: 0 4px; transition: opacity .12s, translate .12s; }
  .pop.show { opacity: 1; translate: 0 0; }
  .pop .ph { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .pop h3 { font-size: 14.5px; margin: 0 0 8px; line-height: 1.35; letter-spacing: -0.01em; }
  .pop p { margin: 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.55; }
  .pop p.none { color: var(--muted); font-style: italic; }
  .pop .foot { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line-2); font-size: 12px; color: var(--muted); }

  footer { margin: 28px 0 36px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .status { display: flex; gap: 6px 12px; flex-wrap: wrap; }
  .status .d { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  footer a { color: var(--muted); }

  /* Desktop: summary in hover card. Touch: inline. */
  @media (hover: hover) { .item .summary { display: none; } }
  @media (hover: none) { .pop { display: none; } }

  @media (max-width: 860px) {
    .featured { grid-template-columns: 1fr 1fr; }
    .featured .feat:nth-child(3) { display: none; }
  }
  @media (max-width: 640px) {
    .top { padding-top: 16px; }
    .sub { display: none; }
    .updated .txt { display: none; }
    /* A sticky multi-row toolbar would eat a phone screen; let it scroll away. */
    .toolbar { position: static; backdrop-filter: none; -webkit-backdrop-filter: none; background: none; }
    .row { flex-wrap: wrap; gap: 6px; }
    .row .search { flex-basis: 100%; }
    .search kbd { display: none; }
    .l { display: none; }
    .s { display: inline; }
    .seg button { padding: 5px 9px; }
    .select { flex: 1 1 140px; min-width: 0; height: 36px; }
    .chips { flex-wrap: nowrap; overflow-x: auto; margin: 10px -16px 0; padding: 0 16px 2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .featured { grid-template-columns: 1fr; }
    .featured .feat:nth-child(3) { display: flex; }
    .item { grid-template-columns: 50px 1fr; gap: 10px; padding: 12px 12px 12px 10px; }
    .score b { font-size: 13.5px; }
    .score span { font-size: 9.5px; }
    .summary, .meta { margin-left: 0; }
    .fav { display: none; }
  }
  @media (max-width: 360px) {
    .seg button { padding: 5px 7px; font-size: 12.5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="12" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.6"/>
          <circle cx="20" cy="20" r="6.5" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.6"/>
          <g class="sweep"><path d="M20 20 L20 8 A12 12 0 0 1 30.4 14 Z" fill="#fff" fill-opacity=".28"/><path d="M20 20 L30.4 14" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
          <circle cx="20" cy="20" r="2" fill="#fff"/>
        </svg>
      </div>
      <div>
        <h1>Tech Radar</h1>
        <p class="sub" id="sub">What developers are talking about right now</p>
      </div>
    </div>
    <div class="actions">
      <span class="updated" id="updated"><span class="live"></span><span class="txt">Loading…</span></span>
      <button class="icon-btn" id="refresh" hidden title="Fetch all sources now">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        <span>Refresh</span>
      </button>
      <button class="icon-btn" id="theme" title="Theme: system" aria-label="Toggle theme"></button>
    </div>
  </header>
</div>

<div class="toolbar" id="toolbar">
  <div class="wrap">
    <div class="row">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Search stories, repos, topics…" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div class="seg" id="window" role="group" aria-label="Time window">
        <button data-v="1">24h</button><button data-v="7"><span class="l">7 days</span><span class="s">7d</span></button><button data-v="30"><span class="l">30 days</span><span class="s">30d</span></button>
      </div>
      <div class="seg" id="sort" role="group" aria-label="Sort">
        <button data-v="hot" title="Engagement weighted by recency">Hot</button>
        <button data-v="top" title="Most points / stars">Top</button>
        <button data-v="new" title="Newest first">New</button>
      </div>
      <select class="select" id="source" aria-label="Source"></select>
    </div>
    <div class="chips" id="topics" role="group" aria-label="Topics"></div>
  </div>
</div>

<main class="wrap">
  <div id="featured-wrap" hidden>
    <div class="section-label"><h2>Top stories</h2><span id="featured-note"></span></div>
    <section class="featured" id="featured"></section>
  </div>
  <div class="section-label" id="list-label"><h2 id="list-title">Latest</h2><span id="count"></span></div>
  <ul class="list" id="list"></ul>
  <button class="icon-btn more" id="more" hidden>Show more</button>
  <footer>
    <div class="status" id="status"></div>
    <div>Updates every 2 hours · <a href="https://github.com/Hideyoshi942/Tech_Radar" target="_blank" rel="noopener">Source on GitHub</a></div>
  </footer>
</main>
<div class="pop" id="pop" role="tooltip"></div>

<script>
const PAGE = 40;
const FEATURED = 3;
const state = Object.assign({ q: '', win: 7, sort: 'hot', source: 'all', topic: 'all' }, load('tech-radar') || {});
let theme = load('tech-radar-theme') || 'system';
let data = { items: [], topics: [], status: {} };
let shown = PAGE;
let current = [];

function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function save() { try { localStorage.setItem('tech-radar', JSON.stringify(state)); } catch {} }

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const compact = new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 });
const SOURCE_SHORT = { hackernews: 'HN', github: 'GitHub', lobsters: 'Lobsters' };

function ago(t) {
  const m = Math.max(1, Math.round((Date.now() - t) / 60000));
  if (m < 60) return m + 'm ago';
  const h = Math.round(m / 60);
  if (h < 48) return h + 'h ago';
  return Math.round(h / 24) + 'd ago';
}
function domain(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } }
function hot(it) { const h = (Date.now() - it.time) / 3600000; return (it.engagement + 5) / Math.pow(h + 2, 1.2); }
function sourceKey(it) { return it.source === 'rss' ? 'rss:' + it.sourceLabel : it.source; }
function summaryOf(it) { return it.desc || it.summary || ''; }
function isTech(it) { return !(it.tags.length === 1 && it.tags[0] === 'other'); }
function topicColor(id) { return `var(--c-${id}, var(--c-other))`; }
function srcColor(it) { return `var(--s-${it.source})`; }
function topicLabel(id) { return (data.topics.find((t) => t.id === id) || { label: id }).label; }

function scoreBox(it) {
  const [n, unit] = it.source === 'github' ? [it.points, 'stars'] : it.source === 'rss' ? [null, 'feed'] : [it.points, 'points'];
  return `<div class="score" style="--sc:${srcColor(it)}">${n == null
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 11a8 8 0 0 1 8 8M5 5a14 14 0 0 1 14 14"/><circle cx="6" cy="18" r="1.5" fill="currentColor"/></svg>'
    : `<b>${compact.format(n)}</b>`}<span>${unit}</span></div>`;
}

function tagsHtml(it) {
  const tags = it.tags.filter((t) => t !== 'other');
  return tags.length ? `<span class="tags">${tags.map((t) => `<button class="tag" data-topic="${t}" style="--tc:${topicColor(t)}">${esc(topicLabel(t))}</button>`).join('')}</span>` : '';
}

function metaHtml(it, { withSource = true, withDomain = true, withTags = true } = {}) {
  const d = domain(it.url);
  const parts = [];
  if (withSource) parts.push(`<span class="src" style="--sc:${srcColor(it)}">${esc(SOURCE_SHORT[it.source] || it.sourceLabel)}</span>`);
  if (d && withDomain) parts.push(`<span>${esc(d)}</span>`);
  parts.push(`<span class="num">${ago(it.time)}</span>`);
  if (it.source === 'hackernews' || it.source === 'lobsters') {
    parts.push(`<a href="${esc(it.discussUrl)}" target="_blank" rel="noopener" class="num">${compact.format(it.comments)} comments</a>`);
  }
  for (const a of it.also || []) parts.push(`<a href="${esc(a.url)}" target="_blank" rel="noopener">also on ${esc(a.label)}</a>`);
  const tags = withTags ? tagsHtml(it) : '';
  if (tags) parts.push(tags);
  return parts.join('<span class="sep">·</span>');
}

function favicon(it) {
  const d = domain(it.url);
  return d ? `<img class="fav" src="https://icons.duckduckgo.com/ip3/${esc(d)}.ico" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '<span class="fav"></span>';
}

function baseFiltered() {
  const cutoff = Date.now() - state.win * 864e5;
  const q = state.q.trim().toLowerCase();
  return data.items.filter((it) =>
    it.time >= cutoff &&
    (state.source === 'all' || (state.source === 'rss' ? it.source === 'rss' : sourceKey(it) === state.source)) &&
    (!q || (it.title + ' ' + summaryOf(it) + ' ' + domain(it.url)).toLowerCase().includes(q)));
}

function render() {
  for (const seg of ['window', 'sort']) {
    const v = seg === 'window' ? String(state.win) : state.sort;
    for (const b of $(seg).children) b.classList.toggle('on', b.dataset.v === v);
  }
  if (document.activeElement !== $('q')) $('q').value = state.q;
  $('source').value = state.source;

  const base = baseFiltered();
  const counts = { all: base.filter(isTech).length };
  for (const it of base) for (const t of it.tags) counts[t] = (counts[t] || 0) + 1;
  $('topics').innerHTML = [{ id: 'all', label: 'All topics' }, ...data.topics]
    .map((t) => `<button class="chip${state.topic === t.id ? ' on' : ''}" data-v="${t.id}" style="--tc:${t.id === 'all' ? 'var(--accent)' : topicColor(t.id)}">` +
      `${t.id === 'all' ? '' : '<span class="dot"></span>'}${esc(t.label)}<span class="n">${counts[t.id] || 0}</span></button>`)
    .join('');

  let items = state.topic === 'all' ? base.filter(isTech) : base.filter((it) => it.tags.includes(state.topic));
  const key = { hot, top: (it) => it.engagement, new: (it) => it.time }[state.sort];
  items = items.map((it) => [key(it), it]).sort((a, b) => b[0] - a[0]).map((x) => x[1]);

  // Featured cards only make sense for the default "hot" browse view.
  const showFeatured = state.sort === 'hot' && !state.q.trim() && items.length > FEATURED + 3;
  const featured = showFeatured ? items.slice(0, FEATURED) : [];
  const rest = showFeatured ? items.slice(FEATURED) : items;
  current = rest;

  $('featured-wrap').hidden = !showFeatured;
  $('featured-note').textContent = { 1: 'last 24 hours', 7: 'this week', 30: 'this month' }[state.win];
  $('featured').innerHTML = featured.map((it, i) => {
    const text = summaryOf(it);
    return `<article class="feat">
      <span class="rankno">${i + 1}</span>
      <div class="meta" style="margin-top:0">${scoreInline(it)}<span class="sep">·</span><span>${esc(domain(it.url) || it.sourceLabel)}</span></div>
      <a class="feat-title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
      ${text ? `<p>${esc(text)}</p>` : ''}
      <div class="meta">${metaHtml(it, { withSource: false, withDomain: false, withTags: false })}</div>
      ${tagsHtml(it) ? `<div class="meta" style="margin-top:0">${tagsHtml(it)}</div>` : ''}
    </article>`;
  }).join('');

  const titles = { hot: 'Trending', top: 'Most popular', new: 'Newest' };
  $('list-title').textContent = state.q.trim() ? `Results for "${state.q.trim()}"` : (showFeatured ? 'More trending' : titles[state.sort]);
  $('count').textContent = `${items.length.toLocaleString()} ${items.length === 1 ? 'story' : 'stories'}`;

  $('list').innerHTML = rest.length ? rest.slice(0, shown).map((it, i) => {
    const text = summaryOf(it);
    const fresh = Date.now() - it.time < 6 * 3600000;
    return `<li class="item" data-i="${i}">
      ${scoreBox(it)}
      <div style="min-width:0">
        <div class="line1">${favicon(it)}<div><a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>${fresh ? '<span class="new">NEW</span>' : ''}</div></div>
        ${text ? `<div class="summary">${esc(text)}</div>` : ''}
        <div class="meta">${metaHtml(it)}</div>
      </div>
    </li>`;
  }).join('') : (featured.length ? '' : `<li class="empty"><b>Nothing here yet</b>No stories match these filters.<br><button class="icon-btn" id="reset">Clear filters</button></li>`);
  $('list').hidden = !rest.length && featured.length > 0;
  $('more').hidden = rest.length <= shown;
  $('more').textContent = `Show more (${(rest.length - shown).toLocaleString()} left)`;
}

function scoreInline(it) {
  const label = it.source === 'github' ? `★ ${compact.format(it.points)}` : it.source === 'rss' ? it.sourceLabel : `▲ ${compact.format(it.points)}`;
  return `<span class="src" style="--sc:${srcColor(it)}">${esc(label)}</span>`;
}

function renderMeta() {
  const txt = $('updated').querySelector('.txt');
  txt.textContent = data.updatedAt
    ? `Updated ${ago(Date.parse(data.updatedAt))}` + (data.refreshing ? ' · refreshing…' : '')
    : 'First fetch in progress…';
  $('updated').title = data.updatedAt ? new Date(data.updatedAt).toLocaleString() : '';
  const feeds = [...new Set(data.items.filter((i) => i.source === 'rss').map((i) => i.sourceLabel))].sort();
  $('sub').textContent = `What developers are talking about · Hacker News, GitHub, Lobsters & ${feeds.length} feeds`;
  const opts = [['all', 'All sources'], ['hackernews', 'Hacker News'], ['github', 'GitHub'], ['lobsters', 'Lobsters'], ['rss', 'All RSS feeds'],
    ...feeds.map((l) => ['rss:' + l, '— ' + l])];
  $('source').innerHTML = opts.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
  $('status').innerHTML = Object.entries(data.status || {}).map(([k, s]) =>
    `<span title="${esc(s.ok ? s.count + ' items' : s.error)}"><span class="d" style="background:${s.ok ? 'var(--new)' : 'var(--c-security)'}"></span>${esc(k)}</span>`).join('');
}

function skeleton() {
  $('list').innerHTML = Array.from({ length: 8 }, () => `<li class="item"><div class="sk" style="height:44px;border-radius:10px"></div>
    <div><div class="sk" style="width:${50 + Math.random() * 40}%"></div><div class="sk" style="width:35%;margin-top:10px;height:10px"></div></div></li>`).join('');
}

// ---------- hover card ----------
let popTimer = null;
let popFor = null;
function showPop(li) {
  const it = current[Number(li.dataset.i)];
  if (!it) return;
  const text = summaryOf(it);
  const pop = $('pop');
  pop.innerHTML = `<div class="ph">${favicon(it)}<span>${esc(domain(it.url) || it.sourceLabel)}</span></div>` +
    `<h3>${esc(it.title)}</h3>` +
    (text ? `<p>${esc(text)}</p>` : '<p class="none">No summary available for this link.</p>') +
    `<div class="foot">${[it.sourceLabel, it.source === 'github' ? `★ ${it.points.toLocaleString()} stars` : it.source === 'rss' ? '' :
      `▲ ${it.points.toLocaleString()} points · ${it.comments.toLocaleString()} comments`, ago(it.time)].filter(Boolean).map(esc).join(' · ')}</div>`;
  const r = li.querySelector('.title').getBoundingClientRect();
  pop.style.left = Math.max(16, Math.min(r.left, innerWidth - pop.offsetWidth - 16)) + 'px';
  const below = r.bottom + 10;
  pop.style.top = (below + pop.offsetHeight > innerHeight - 8 ? Math.max(8, r.top - pop.offsetHeight - 10) : below) + 'px';
  pop.classList.add('show');
}
function hidePop() { clearTimeout(popTimer); popFor = null; $('pop').classList.remove('show'); }

// ---------- theme ----------
const THEME_ICONS = {
  system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
};
function applyTheme() {
  if (theme === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = theme;
  $('theme').innerHTML = THEME_ICONS[theme];
  $('theme').title = 'Theme: ' + theme;
}

// ---------- data ----------
async function fetchData(method = 'GET') {
  const res = await fetch(method === 'POST' ? 'api/refresh' : 'data.json', { method, cache: 'no-store' });
  data = await res.json();
  $('refresh').hidden = data.mode !== 'server';
  renderMeta();
  render();
  if (data.mode === 'server' && (!data.updatedAt || data.refreshing)) setTimeout(fetchData, 4000);
}

// ---------- events ----------
const resetPage = () => { shown = PAGE; save(); render(); };
$('q').addEventListener('input', (e) => { state.q = e.target.value; resetPage(); });
$('source').addEventListener('change', (e) => { state.source = e.target.value; resetPage(); });
$('window').addEventListener('click', (e) => { if (e.target.dataset.v) { state.win = Number(e.target.dataset.v); resetPage(); } });
$('sort').addEventListener('click', (e) => { if (e.target.dataset.v) { state.sort = e.target.dataset.v; resetPage(); } });
$('topics').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (b) { state.topic = b.dataset.v; resetPage(); } });
document.addEventListener('click', (e) => {
  const tag = e.target.closest('.tag');
  if (tag) { state.topic = tag.dataset.topic; resetPage(); scrollTo({ top: 0, behavior: 'smooth' }); }
  if (e.target.closest('#reset')) { Object.assign(state, { q: '', source: 'all', topic: 'all', win: 30 }); resetPage(); }
});
$('more').addEventListener('click', () => { shown += PAGE; render(); });
$('refresh').addEventListener('click', async (e) => {
  const b = e.currentTarget;
  b.disabled = true; b.querySelector('span').textContent = 'Refreshing…';
  try { await fetchData('POST'); } finally { b.disabled = false; b.querySelector('span').textContent = 'Refresh'; }
});
$('theme').addEventListener('click', () => {
  theme = { system: 'light', light: 'dark', dark: 'system' }[theme];
  try { localStorage.setItem('tech-radar-theme', JSON.stringify(theme)); } catch {}
  applyTheme();
});
$('list').addEventListener('mouseover', (e) => {
  const li = e.target.closest('.item');
  if (!li || li === popFor || li.dataset.i == null) return;
  hidePop();
  popFor = li;
  popTimer = setTimeout(() => showPop(li), 250);
});
$('list').addEventListener('mouseleave', hidePop);
addEventListener('scroll', () => {
  hidePop();
  $('toolbar').classList.toggle('stuck', $('toolbar').getBoundingClientRect().top <= 0 && scrollY > 80);
}, { passive: true });
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
  else if (e.key === 'Escape' && document.activeElement === $('q')) { state.q = ''; $('q').value = ''; $('q').blur(); resetPage(); }
});

applyTheme();
skeleton();
fetchData();
setInterval(fetchData, 10 * 60 * 1000);
</script>
</body>
</html>
